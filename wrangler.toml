# trpg-warehouse · 纯点击部署配置（GitHub 网页编辑 + Cloudflare Dashboard 点选）
#
# ★ 这份文件是绑定的唯一真值：Workers Builds 每次从 GitHub 部署都会以它为准，
#   只在 Dashboard 里手加的 D1 / R2 绑定与 vars 会被覆盖掉，所以真实值必须写在这里。
#   secrets 例外：在 Dashboard → Settings → Variables and Secrets 里加，部署会保留。
#
# ★ 部署全程不需要本地命令行。要填的只有下面 5 个 REPLACE_* 值，
#   全部在 GitHub 网页打开本文件点铅笔 Edit 一次替换即可；
#   第 6 个值「站点域名」不写在这里，用于 Access 应用与 R2 CORS。
#   每个值从哪个页面复制，见 docs/部署指引_纯点击.md 第 1 步的「值清单」。
#
# 上架不消耗任何构建：模组资源走 R2，索引走 D1，静态壳只在 push 代码时重新部署。
name = "trpg-warehouse"
main = "worker/src/index.ts"
compatibility_date = "2026-11-18"

# 高频侧（首页 / 条目页 / 预览页 / CSS / JS）由边缘直出，不跑 Worker；
# /api/* 与 /upload* 走 Worker，便于做 Access 校验与 API 路由。
# 注意：/upload/index.html 是真实静态文件，必须靠 run_worker_first 让 Worker 先跑，
#       否则会被边缘直接吐出来、绕过 Access。
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/upload",
  "/upload/*",
]

# ① database_id：D1 SQL Databases → 你的数据库 → 详情页复制 Database ID
#    database_name 必须与 Dashboard 里创建的库名完全一致：trpg-warehouse-db
[[d1_databases]]
binding = "DB"
database_name = "trpg-warehouse-db"
database_id = "fcfdf05f-1243-4589-921b-df0a4ac19492"
migrations_dir = "./migrations"

# ② bucket_name 必须与 Dashboard 里创建的桶名完全一致：trpg-warehouse-assets
[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "trpg-warehouse-assets"

[vars]
# ③ R2 公开读基址（不带末尾斜杠）：R2 → bucket → Settings → Custom Domains 复制。
#    预览页与主控台内链都从这里拼；必须用自定义域，不要用 r2.dev 开发域
#    （官方明确 r2.dev 不支持 WAF / 缓存 / 访问控制，会让部署指引第 8 步的成本控制全部失效）。
R2_PUBLIC_BASE_URL = "https://warehouseasset.finewinginnovation.cn"
R2_BUCKET = "trpg-warehouse-assets"
# ④ Account ID：Cloudflare Dashboard 右侧栏 / 账户首页复制那串 32 位十六进制
R2_ACCOUNT_ID = "70e37bf4d154d01d8d96cd83b6af2700"
# ⑤ Team domain：Zero Trust → Settings → Team domain（形如 xxxx.cloudflareaccess.com）
# ⑥ AUD：Zero Trust → Access → Applications → 应用 Overview → Application Audience (AUD) Tag
CF_ACCESS_TEAM_DOMAIN = "finewinginnovation.cloudflareaccess.com"
CF_ACCESS_AUD = "6a69c26ebfd3c7306c8d299d2db653f4d286e95df4be54da9655af9f8711dc06"
PRESIGN_EXPIRES = "3600"

# 成本闸门（B1-3）：R2 没有原生硬性账单上限，Worker 在写口自己卡体积 / 数量 / 累计容量。
# 这 4 个是可选阈值，在 GitHub 网页编辑本文件即可调，不必改代码；缺省值与 shared/cost.js 一致。
# BUCKET_CAP_GB 会被钳制到 10（R2 免费存储上限），填更大也不会放行超额上架。
MAX_SINGLE_FILE_MB = "50"
MAX_ENTRY_MB = "200"
MAX_FILES_PER_ENTRY = "500"
BUCKET_CAP_GB = "8"

# ★ 一键熔断（纯点击）：把这里改成 "0" → Commit → Workers Builds 自动部署，
#   /api/upload/prepare 与 /api/upload/finalize 立刻返回 503，不再写 R2 / D1。
#   发现用量异常、或单纯想先停一停时用它；配合 R2 → Settings → Custom Domains → Disable domain
#   立即切断公开读，就完成「宁可停止访问也不付账单」。恢复把值改回 "1" 即可，无需改代码。
#   刻意不引入任何 cron / alarm / 定时遍历脚本 —— 成本机制本身绝不能烧额度。
WRITES_ENABLED = "0"

# 3 个 Secret 不写在这里，在 Dashboard → Worker → Settings → Variables and Secrets 加：
#   R2_ACCESS_KEY_ID       R2 S3 API token 的 Access Key ID
#   R2_SECRET_ACCESS_KEY   R2 S3 API token 的 Secret Access Key
#   UPLOAD_TOKEN_SECRET    prepare→finalize 一次性令牌的 HMAC 密钥（随机长字符串）
# 注意：不要用 Worker → Settings → Domains & Routes 的「Enable Cloudflare Access」一键开关，
#       那个会把整个站点（含公开浏览端）都锁上；本项目只锁 /upload* 与 /api/upload*。

# ★ 首次部署即绑定正式站点域名（本版新增）
#   部署时会自动创建 DNS 记录并签发证书，不必再去 Dashboard 手点；
#   写在这里才符合「仓库配置是唯一真值」，下一次 Git 部署不会把它冲掉。
[[routes]]
pattern = "warehouse.finewinginnovation.cn"
custom_domain = true
