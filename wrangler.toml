# trpg-warehouse · B1 最小实现
# 单 Worker：静态壳（Workers Assets）+ 唯一 Worker 脚本（API / Access / 预签名 / D1）
# 上架不消耗任何构建：模组资源走 R2，索引走 D1，静态壳只在改代码时重新 deploy。
#
# 部署前把下面 4 处 REPLACE 换成你自己的值，并用 `wrangler secret put` 写入 3 个 secret。
name = "trpg-warehouse"
main = "worker/src/index.ts"
compatibility_date = "2026-11-18"

# 高频侧（首页 / 条目页 / 预览页 / CSS / JS）由边缘直出，不跑 Worker；
# /api/* 与 /upload* 走 Worker，便于做 Access 校验与 API 路由。
[assets]
directory = "./web"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/upload",
  "/upload/",
  "/upload/*",
]

[[d1_databases]]
binding = "DB"
database_name = "trpg-warehouse-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "./migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "trpg-warehouse-assets"

[vars]
# R2 自定义域公开读基址（不带末尾斜杠）；预览页与主控台内链都从这里拼。
R2_PUBLIC_BASE_URL = "https://assets.example.com"
R2_BUCKET = "trpg-warehouse-assets"
R2_ACCOUNT_ID = "REPLACE_WITH_CLOUDFLARE_ACCOUNT_ID"
# Cloudflare Access 应用（保护 /upload* 与 /api/upload*）的 team domain 与 AUD
CF_ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
CF_ACCESS_AUD = "REPLACE_WITH_ACCESS_AUD"
PRESIGN_EXPIRES = "3600"

# secrets（不进仓库，用 `npx wrangler secret put <NAME>` 写入）：
#   R2_ACCESS_KEY_ID       R2 S3 API token 的 Access Key ID
#   R2_SECRET_ACCESS_KEY   R2 S3 API token 的 Secret Access Key
#   UPLOAD_TOKEN_SECRET    prepare→finalize 一次性令牌的 HMAC 密钥（随机长字符串）
